version: '3.8'

services:
  jupyterlab:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    volumes:
      # Mount the current directory into the container to enable live development
      - .:/home/jovyan/extension
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - BACKEND_URL=http://localhost:8000
    # The command automatically installs the extension in editable mode,
    # builds it, and starts JupyterLab without a password for local dev.
    command: >
      bash -c "pip install --editable '.[dev,test]' &&
               jupyter labextension develop . --overwrite &&
               jupyter server extension enable GdDS &&
               jlpm install &&
               jlpm build &&
               jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --NotebookApp.token='' --NotebookApp.password=''"
