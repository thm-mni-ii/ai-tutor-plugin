<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Tutor – Dev Preview</title>
    <style>
      /*
       * Mock JupyterLab CSS variables so var(--jp-*) tokens resolve in the
       * dev server. These are never shipped — they only exist in this file.
       * Values match JupyterLab's default light theme.
       */
      :root {
        --jp-ui-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        --jp-ui-font-size1: 13px;
        --jp-ui-font-color1: #212121;
        --jp-ui-font-color2: #616161;
        --jp-layout-color1: #ffffff;
        --jp-layout-color2: #eeeeee;
        --jp-layout-color3: #bdbdbd;
        --jp-border-color2: #e0e0e0;
        --jp-brand-color1: #1976d2;
        --jp-warn-color1: #f57c00;
        --jp-error-color1: #d32f2f;
        --jp-code-font-family: 'Source Code Pro', 'Courier New', monospace;
        --jp-code-font-size: 13px;
      }

      body {
        margin: 0;
        background: #f0f0f0;
        display: flex;
        justify-content: center;
        padding: 32px 16px;
        font-family: var(--jp-ui-font-family);
      }

      /* Simulate the JupyterLab right sidebar panel */
      #app {
        width: 320px;
        min-height: 600px;
        background: var(--jp-layout-color1);
        border: 1px solid var(--jp-border-color2);
        border-radius: 2px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
