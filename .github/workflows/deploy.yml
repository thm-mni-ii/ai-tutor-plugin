name: Deploy

on:
  push:
    branches:
      - test

jobs:
  deploy:
    runs-on: [self-hosted, test-deployment]
    environment: test-deployment

    steps:
      - name: Check SSH Secrets
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          test -n "$SSH_KEY" || { echo "SSH_PRIVATE_KEY is missing"; exit 1; }
          test -n "$SSH_HOST" || { echo "SSH_HOST is missing"; exit 1; }
          test -n "$SSH_USER" || { echo "SSH_USER is missing"; exit 1; }
      
          echo "All SSH-Secrets present"
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export DOCKER_HOST="unix://${XDG_RUNTIME_DIR}/docker.sock"
            docker compose up -d --build
